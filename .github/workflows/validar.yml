name: Validación del Dojo Virtual
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm i --no-audit --no-fund
      - name: Pruebas internas de la base de datos
        run: node pruebas/db.test.mjs
      - name: Instalar navegador de pruebas
        run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Correr validación
        run: node pruebas/validar.js
