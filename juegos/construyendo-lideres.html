<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construyendo Líderes Dicka | DICKA Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#1D2586;--brillante:#2138D3;--marino:#011131;--amarillo:#f5c400;--verde:#2e9e5b;--gris:#6b7390;--papel:#f4f6fb;--linea:#dfe3f0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b1640;font-family:Inter,'Segoe UI',Roboto,Arial,sans-serif}
#lienzo{position:fixed;inset:0}
#lienzo canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;pointer-events:none;z-index:2}
.marca{background:rgba(1,17,49,.82);color:#fff;border-radius:14px;padding:10px 14px;border:1px solid rgba(245,196,0,.45)}
.marca small{display:block;color:var(--amarillo);font-size:10px;font-weight:800;letter-spacing:.08em}
.marca h1{font-family:Poppins,Inter,Arial;font-size:17px;margin-top:2px}
.fase{background:#fff;color:var(--azul);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.aviso{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(1,17,49,.9);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;font-weight:700;border:2px solid var(--amarillo);display:none;z-index:3;white-space:nowrap}
.aviso.on{display:block}
.fundido{position:fixed;inset:0;background:#070b18;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.fundido.on{opacity:1}
.tarjeta-modulo{white-space:normal;min-width:260px;max-width:340px;text-align:left}
.tarjeta-modulo b{display:block;font-size:14px;color:#f5c400}
.tarjeta-modulo small{display:block;font-size:12px;opacity:.9;margin-top:3px;line-height:1.35}
.tarjeta-modulo .est{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;background:#fff;color:#1b2240}
.controles{position:fixed;left:14px;bottom:14px;z-index:3;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px}
.controles button{border:0;border-radius:14px;background:rgba(255,255,255,.92);color:var(--azul);font-size:22px;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.3);touch-action:none;user-select:none}
.controles button:active{background:#fff;transform:scale(.96)}
.controles .arriba{grid-column:2;grid-row:1}.controles .izq{grid-column:1;grid-row:2}.controles .abajo{grid-column:2;grid-row:2}.controles .der{grid-column:3;grid-row:2}
.entrar{position:fixed;right:14px;bottom:14px;z-index:3;border:0;border-radius:18px;background:var(--amarillo);color:var(--azul);font-weight:800;font-size:16px;padding:16px 20px;box-shadow:0 6px 14px rgba(0,0,0,.35);display:none}
.entrar.on{display:block}
.panel{position:fixed;inset:0;background:rgba(1,17,49,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.panel.on{display:flex}
.caja{background:var(--papel);border-radius:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 14px 36px rgba(0,0,0,.45)}
.caja .cab{background:linear-gradient(135deg,var(--azul),var(--marino));color:#fff;padding:16px 18px}
.caja .cab small{font-size:10px;letter-spacing:.08em;color:var(--amarillo);font-weight:800}
.caja .cab h2{font-family:Poppins,Inter,Arial;font-size:18px;margin-top:4px;line-height:1.25}
.caja .cuerpo{padding:14px}
.puerta{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;border-left:6px solid var(--brillante)}
.puerta h3{font-size:15px;color:var(--azul);font-family:Poppins,Inter,Arial}
.puerta p{font-size:13px;color:var(--gris);margin:4px 0 10px;line-height:1.4}
.puerta ul{font-size:13px;color:#33395a;margin:4px 0 10px 18px;line-height:1.5}
.btn{display:inline-block;border:0;border-radius:12px;background:var(--brillante);color:#fff;font-weight:800;font-size:14px;padding:11px 16px;text-decoration:none;font-family:inherit;cursor:pointer}
.btn[disabled]{background:#c9cde0;color:#5b6378;cursor:default}
.chip{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;background:#fff4cc;color:#8a6d00}
.chip.ok{background:#d7f0e0;color:#1f6d40}
.chip.pend{background:#eef0f7;color:#44506e}
.cerrar{display:block;width:100%;margin-top:6px;border:2px solid var(--linea);background:#fff;color:var(--azul);font-weight:800;border-radius:12px;padding:11px;cursor:pointer;font-family:inherit}
.nota{font-size:11px;color:var(--gris);margin-top:6px}
.eval-fila{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;border:2px solid var(--linea);cursor:pointer;font-family:inherit;text-align:left;width:100%;color:inherit}
.eval-fila b{color:var(--azul);font-size:14px}
.eval-fila small{color:var(--gris);font-size:12px}
.barra-ev{height:8px;background:var(--linea);border-radius:999px;overflow:hidden;margin-top:6px}
.barra-ev i{display:block;height:100%;background:var(--verde)}
</style>
</head>
<body>

<div id="lienzo"></div>

<div class="hud">
  <div class="marca"><small>DOJO DE MANDO · CONSTRUYENDO LÍDERES DICKA</small><h1>Aprende. Entrena. Practica. Lidera.</h1><div id="objetivo" style="margin-top:6px;font-size:12px;font-weight:700;color:#fff">Objetivo: explora los cuatro módulos · <span id="visitados">0/4</span></div><div style="height:6px;background:rgba(255,255,255,.2);border-radius:99px;margin-top:4px;overflow:hidden"><i id="barraRecorrido" style="display:block;height:100%;width:0;background:#f5c400;transition:width .4s"></i></div></div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto"><div class="fase" id="faseActiva">Fase 1 activa</div><button class="fase" id="btnEval" style="border:0;cursor:pointer" onclick="abrirEvaluacion()">📊 Evaluación</button><button class="fase" style="border:0;cursor:pointer" onclick="abrirMapa()">🗺️ Mapa</button></div>
</div>

<div class="aviso" id="aviso"></div>
<div class="fundido" id="fundido"></div>

<div class="controles" aria-label="Controles de movimiento">
  <button class="arriba" data-k="w" aria-label="Avanzar">▲</button>
  <button class="izq" data-k="a" aria-label="Girar a la izquierda">◀</button>
  <button class="abajo" data-k="s" aria-label="Retroceder">▼</button>
  <button class="der" data-k="d" aria-label="Girar a la derecha">▶</button>
</div>
<button class="entrar" id="btnEntrar">Entrar al edificio (E)</button>

<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="tituloPanel">
  <div class="caja" id="caja"></div>
</div>

<script>var LOGO_DATA = "assets/textures/dojo-dicka-logo.webp", LOGO_DATA_W = LOGO_DATA;</script>
<script src="comun/three-libs.js?v=13.6"></script>
<script src="comun/almacen-comun.js?v=13.6"></script>
<script src="comun/avatares.js?v=14.8"></script>
<script>
/* ===================== Configuración ===================== */
const LAPZO_URL = '';   // enlace al curso de Lapzo: pendiente de validar con su administrador
const CASOS = {   /* casos ya cargados en el Dojo (nivel Jefatura) */
  m1: [['mejor','El mejor operador · escenario completo'],['junta_tiempoextra','Junta: tiempo extra sin pagar'],['junta_dispuesta','Junta: colaboradora dispuesta'],['junta_liderpobre','Junta: líder de equipo sin comunicación'],['junta_actitud','Junta: productivo con mala actitud'],['junta_nuevo','Junta: operador nuevo con miedo a preguntar'],['junta_epp','Junta: se niega al uso del chaleco'],['junta_conflicto_compa','Junta: compañero que le deja el trabajo pesado'],['junta_faltas','Junta: faltas por problema familiar'],['desempeno2','Evaluación de desempeño baja'],['renuncia','Renuncia de tu mejor elemento'],['malasnoticias','Malas noticias al equipo']],
  m2: [['accidente2','Accidente: causa raíz'],['antidoping','Antidoping positivo en periodo de prueba'],['tiempoextra2','Tiempo extra y cambio de horarios'],['terminacion','Comunicar una terminación']],
  m3: [['faltante','Faltante de inventario']],
  m4: [['wms','Cambio de WMS (resistencia al cambio)']]
};
const PENDIENTES = {   /* casos sugeridos en el brief que aún no están cargados */
  m2: ['Operador en estado inconveniente', 'Operador nuevo sin DC-3', 'Queja de hostigamiento'],
  m3: ['Diferencia de inventario que amenaza el cierre', 'Backlog de surtido al cierre del turno', 'Error de verificación o embarque', 'Cliente solicita prioridad extraordinaria', 'Descoordinación entre turnos'],
  m4: ['El sistema muestra una ubicación sin existencia física', 'Se detecta una diferencia en recepción', 'Una tarea de surtido está bloqueada', 'El operador confirma un movimiento incorrecto', 'Hay una diferencia entre sistema y físico', 'Se requiere reubicar mercancía con trazabilidad']
};
const MODULOS = [
  { id: 'm1', nombre: 'MÓDULO 1. TÚ ERES UNA PIEZA CLAVE COMO LÍDER', corto: 'Módulo 1 · Pieza clave como líder', color: 0x2138D3, activo: true,  x: -9 },
  { id: 'm2', nombre: 'MÓDULO 2. SEGURIDAD, CALIDAD Y NORMATIVIDAD',  corto: 'Módulo 2 · Seguridad y normatividad', color: 0x2e9e5b, activo: false, x: -3 },
  { id: 'm3', nombre: 'MÓDULO 3. PROCESOS OPERATIVOS',                corto: 'Módulo 3 · Procesos operativos', color: 0x8a5a2b, activo: false, x: 3 },
  { id: 'm4', nombre: 'MÓDULO 4. ESPECIALIZACIÓN: WMS',               corto: 'Módulo 4 · Especialización WMS', color: 0x1769aa, activo: false, x: 9 }
];
const Z_EDIFICIOS = -12;
const LIMITE = { x: 14, zMin: -17, zMax: 12 };
const VEL = 4.2, GIRO = 2.4, RADIO_ENTRADA = 3.2;

/* ===================== Escena ===================== */
const cont = document.getElementById('lienzo');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.setClearColor(0xbfe6ff);
cont.appendChild(renderer.domElement);
const escena = new THREE.Scene();
escena.fog = new THREE.Fog(0xbfe6ff, 40, 90);
const camara = new THREE.PerspectiveCamera(55, 1, 0.1, 200);

escena.add(new THREE.HemisphereLight(0xffffff, 0x556070, 0.85));
const sol = new THREE.DirectionalLight(0xffffff, 0.9);
sol.position.set(-8, 16, 10); sol.castShadow = true;
sol.shadow.mapSize.set(1024, 1024); sol.shadow.camera.left = -22; sol.shadow.camera.right = 22; sol.shadow.camera.top = 22; sol.shadow.camera.bottom = -22;
escena.add(sol);
/* entorno procedural: sus objetos se registran para ocultarlos cuando carga la nave 3D (GLB); si el GLB no carga, se conserva */
const ENV_PROC = [];
const _escenaAdd = escena.add.bind(escena);
escena.add = function (...objs) { objs.forEach(o => { if (!o.isLight) ENV_PROC.push(o); }); return _escenaAdd(...objs); };

/* piso industrial con franjas de seguridad */
var _texCache = {};   // caché de texturas del módulo compartido (debe existir antes de usarlas)
var WAREHOUSE = { w: 60, d: 90, h: 12 };   // medidas de la nave que usan las texturas del módulo compartido
/* piso de concreto pulido del simulador (textura generada por el módulo compartido) */
const texPiso = typeof concreteTex === 'function' ? concreteTex() : new THREE.TextureLoader().load('assets/textures/piso.jpg');
texPiso.wrapS = texPiso.wrapT = THREE.RepeatWrapping; texPiso.repeat.set(10, 10); texPiso.anisotropy = 8;
const piso = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ map: texPiso, color: 0xffffff, roughness: 0.82, metalness: 0.02 }));
piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true; escena.add(piso);
const franja = (x, z, w, d, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 })); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.01, z); escena.add(m); };
franja(0, 2, 30, 0.35, 0xf5c400);
franja(0, -7, 30, 0.2, 0xffffff);
franja(-14, -4, 0.35, 26, 0xf5c400);
franja(14, -4, 0.35, 26, 0xf5c400);

/* muro de fondo y techo de nave */
const muro = new THREE.Mesh(new THREE.BoxGeometry(60, 9, 0.6), new THREE.MeshStandardMaterial({ color: 0xdfe6ee }));
muro.position.set(0, 4.5, -19); muro.receiveShadow = true; escena.add(muro);
const lados = [-30, 30].map(x => { const m = new THREE.Mesh(new THREE.BoxGeometry(0.6, 9, 40), new THREE.MeshStandardMaterial({ color: 0xdfe6ee })); m.position.set(x, 4.5, -4); escena.add(m); return m; });

/* racks decorativos al fondo (no interactivos) */
const caja = (w, h, d, c) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 }));
[-20, -16, 16, 20].forEach(x => {
  const rack = new THREE.Group();
  const poste = caja(0.2, 6, 1.2, 0x2138D3); poste.position.set(-1, 3, 0); rack.add(poste);
  const poste2 = caja(0.2, 6, 1.2, 0x2138D3); poste2.position.set(1, 3, 0); rack.add(poste2);
  [1.5, 3.2, 4.8].forEach(y => { const v = caja(2.4, 0.15, 1.3, 0xf26b1d); v.position.set(0, y, 0); rack.add(v); });
  [1.9, 3.6].forEach(y => { const c2 = caja(1.4, 1.2, 0.9, 0xc9a06a); c2.position.set(0, y, 0); rack.add(c2); });
  rack.position.set(x, 0, -17.5); escena.add(rack);
});

/* edificios: arco con letrero, color del módulo y puerta */
const etiquetas = {};
function textura(texto, color) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#' + color.toString(16).padStart(6, '0'); g.fillRect(0, 0, 512, 256);
  g.fillStyle = '#ffffff'; g.font = '800 46px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  texto.split('\n').forEach((t, i, arr) => g.fillText(t, 256, 128 + (i - (arr.length - 1) / 2) * 56));
  return new THREE.CanvasTexture(c);
}
/* edificios tipo arco con luz perimetral, icono y accesorios de andén (inspirados en la referencia) */
const ICONOS = { m1: '👥', m2: '🦺', m3: '📦', m4: '💻' };
function iconoTex(emoji, fondo) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = fondo; g.beginPath(); g.arc(128, 128, 124, 0, Math.PI * 2); g.fill();
  g.font = '150px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#ffffff'; g.fillText(emoji, 128, 140);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
MODULOS.forEach(m => {
  const g = new THREE.Group(); g.position.set(m.x, 0, Z_EDIFICIOS + 2);   // frente del edificio en z = -10
  const W = 2.5, R = 2.5, pared = 2.2, prof = 3.2;
  const forma = new THREE.Shape();
  forma.moveTo(-W, 0); forma.lineTo(-W, pared); forma.absarc(0, pared, R, Math.PI, 0, true); forma.lineTo(W, 0); forma.lineTo(-W, 0);
  const geo = new THREE.ExtrudeGeometry(forma, { depth: prof, bevelEnabled: true, bevelSize: 0.08, bevelThickness: 0.08, bevelSegments: 2, curveSegments: 32 });
  const cuerpo = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: new THREE.Color(m.color), roughness: 0.5, metalness: 0.15 }));
  cuerpo.position.z = -prof; cuerpo.castShadow = true; cuerpo.receiveShadow = true; g.add(cuerpo);
  /* puerta de cristal oscuro y marco */
  const puerta = new THREE.Mesh(new THREE.BoxGeometry(2.6, 2.7, 0.1), new THREE.MeshStandardMaterial({ color: m.activo ? 0x1b2a4a : 0x1b2240, roughness: 0.2, metalness: 0.4 }));
  puerta.position.set(0, 1.35, 0.12); g.add(puerta);
  /* luz perimetral del arco */
  const puntos = [];
  puntos.push(new THREE.Vector3(-W, 0, 0.14), new THREE.Vector3(-W, pared, 0.14));
  for (let i = 0; i <= 24; i++) { const a = Math.PI - (i / 24) * Math.PI; puntos.push(new THREE.Vector3(Math.cos(a) * R, pared + Math.sin(a) * R, 0.14)); }
  puntos.push(new THREE.Vector3(W, pared, 0.14), new THREE.Vector3(W, 0, 0.14));
  const luz = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(puntos), 120, 0.05, 8, false), new THREE.MeshBasicMaterial({ color: m.activo ? 0xffd54a : 0x9aa3c7 }));
  g.add(luz);
  /* icono y letrero sobre el arco */
  const icono = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.1), new THREE.MeshBasicMaterial({ map: iconoTex(ICONOS[m.id], '#' + m.color.toString(16).padStart(6, '0')), transparent: true }));
  icono.position.set(0, pared + R + 0.85, 0.2); g.add(icono);
  const letrero = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 0.7), new THREE.MeshBasicMaterial({ map: textura(m.id === 'm1' ? 'MÓDULO 1' : m.id === 'm2' ? 'MÓDULO 2' : m.id === 'm3' ? 'MÓDULO 3' : 'MÓDULO 4', m.color) }));
  letrero.position.set(0, pared + R + 0.25, 0.2); g.add(letrero);
  if (!m.activo) {
    const aviso = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.45), new THREE.MeshBasicMaterial({ map: textura('PRÓXIMAMENTE', 0x44506e) }));
    aviso.position.set(0, 2.8, 0.2); g.add(aviso);
  }
  /* macetas y bolardos junto a la puerta */
  [-3.3, 3.3].forEach(x => {
    const maceta = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.45, 0.6, 16), new THREE.MeshStandardMaterial({ color: 0x9aa3ad, roughness: 0.8 }));
    maceta.position.set(x, 0.3, 1.1); maceta.castShadow = true; g.add(maceta);
    const hoja = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12), new THREE.MeshStandardMaterial({ color: 0x2e9e5b, roughness: 0.9 }));
    hoja.position.set(x, 1.0, 1.1); hoja.castShadow = true; g.add(hoja);
  });
  /* diseño 3D de la entrada: escalón, columnas con luz del módulo, tarimas con cajas y marco del letrero */
  const mat3 = (c, r = 0.7, mt = 0.1) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: mt });
  const caja3 = (w, h, d, x, y, z, c = 0xc9a06a) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat3(c, 0.95, 0)); b.position.set(x, y, z); b.castShadow = true; b.receiveShadow = true; g.add(b); return b; };
  const colorModulo = new THREE.Color(m.color);
  /* escalón de acceso en dos niveles */
  caja3(4.6, 0.14, 1.0, 0, 0.07, 1.7, 0xc9d0da);
  caja3(3.4, 0.14, 0.6, 0, 0.21, 1.3, 0xd6dde6);
  /* columnas laterales con tira LED del color del módulo */
  [-2.9, 2.9].forEach(x => {
    caja3(0.36, 2.6, 0.36, x, 1.3, 0.9, 0x5b6478);
    const led = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.3, 0.05), new THREE.MeshBasicMaterial({ color: colorModulo }));
    led.position.set(x, 1.3, 1.1); g.add(led);
  });
  /* tarimas con cajas a cada lado de la entrada (escala real: tarima 1.2 m, cajas 0.6 m) */
  [-4.3, 4.3].forEach(x => {
    caja3(1.2, 0.14, 1.0, x, 0.07, 2.2, 0xb8864b);
    caja3(0.6, 0.6, 0.55, x - 0.28, 0.44, 2.2);
    caja3(0.6, 0.6, 0.55, x + 0.28, 0.44, 2.2, 0xb99460);
    caja3(0.6, 0.5, 0.55, x, 1.0, 2.2, 0xc9a06a);
  });
  /* marco 3D del letrero del módulo */
  caja3(4.5, 0.95, 0.12, 0, pared + R + 0.25, 0.05, 0x2a3350);
  [-1.6, 1.6].forEach(x => {
    const bolardo = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1, 12), new THREE.MeshStandardMaterial({ color: 0xf5c400, roughness: 0.5 }));
    bolardo.position.set(x * 1.7, 0.5, 1.6); bolardo.castShadow = true; g.add(bolardo);
  });
  g.userData.modulo = m.id;
  escena.add(g); etiquetas[m.id] = g;
});

/* personaje del participante (líder): figura simple con chaleco reflejante */
const avatar = new THREE.Group();
const piel = new THREE.MeshStandardMaterial({ color: 0xc68a5e, roughness: 0.7 });
const azul = new THREE.MeshStandardMaterial({ color: 0x1769aa, roughness: 0.8 });
const naranja = new THREE.MeshStandardMaterial({ color: 0xf26b1d, roughness: 0.5, emissive: 0x331000, emissiveIntensity: 0.15 });

function texturaTexto(texto, fondo, colorTexto = '#ffffff') {

  g.fillStyle = fondo; g.fillRect(0, 0, 512, 256);
  g.fillStyle = colorTexto; g.font = '800 44px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  texto.split('\n').forEach((t, i, arr) => g.fillText(t, 256, 128 + (i - (arr.length - 1) / 2) * 52));
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4; return tex;
}
function aplicarMapas() {
  const cart = new THREE.TextureLoader().load('assets/textures/carton.jpg');

  [cart, made].forEach(t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; });

/* montacargas en movimiento: modelo con mástil, horquillas, cabina con protector y ruedas. El frente es +z (hacia las horquillas) */
function makeMontacargas(color) {
  const g = new THREE.Group();
  const mat = (c, r = 0.6, m = 0.1) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
  const add = (geo, m, x, y, z, rx = 0, ry = 0, rz = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.rotation.set(rx, ry, rz); o.castShadow = true; o.receiveShadow = true; g.add(o); return o; };
  const pintura = mat(color, 0.45, 0.2), negro = mat(0x1d1d1d, 0.8), gris = mat(0x3a3f47, 0.5, 0.4);
  const luz = new THREE.MeshStandardMaterial({ color: 0xfff6d5, emissive: 0xffe9a0, emissiveIntensity: 0.6 });
  add(new THREE.BoxGeometry(0.95, 0.42, 1.15), pintura, 0, 0.45, -0.1);          // chasis
  add(new THREE.BoxGeometry(0.98, 0.5, 0.42), negro, 0, 0.55, -0.8);              // contrapeso
  add(new THREE.BoxGeometry(0.7, 0.3, 0.5), pintura, 0, 0.8, 0.3);                // cofre
  [-0.32, 0.32].forEach(x => add(new THREE.BoxGeometry(0.09, 2.3, 0.1), gris, x, 1.5, 0.78));   // largueros del mástil
  add(new THREE.BoxGeometry(0.78, 0.09, 0.1), gris, 0, 2.65, 0.78);               // travesaño
  [-0.3, 0.3].forEach(x => add(new THREE.BoxGeometry(0.1, 0.06, 1.1), gris, x, 0.3, 1.35));   // horquillas
  [[-0.42, -0.5], [0.42, -0.5], [-0.42, -0.95], [0.42, -0.95]].forEach(([x, z]) => add(new THREE.CylinderGeometry(0.04, 0.04, 1.85, 8), negro, x, 1.4, z));   // postes de la cabina
  add(new THREE.BoxGeometry(1.0, 0.07, 1.0), negro, 0, 2.35, -0.72);              // techo de la cabina
  add(new THREE.BoxGeometry(0.42, 0.12, 0.42), negro, 0, 0.95, -0.55);            // asiento
  add(new THREE.BoxGeometry(0.42, 0.5, 0.08), negro, 0, 1.2, -0.8);               // respaldo
  add(new THREE.TorusGeometry(0.12, 0.015, 8, 20), negro, 0.02, 1.25, -0.2, -Math.PI / 3);   // volante
  [[-0.46, 0.18, 0.38], [0.46, 0.18, 0.38], [-0.46, 0.18, -0.55], [0.46, 0.18, -0.55]].forEach(([x, y, z]) => add(new THREE.CylinderGeometry(0.18, 0.18, 0.12, 14), negro, x, y, z, 0, 0, Math.PI / 2));   // ruedas
  [-0.3, 0.3].forEach(x => add(new THREE.BoxGeometry(0.1, 0.06, 0.04), luz, x, 0.95, 0.58));   // faros
  return g;
}

function animarAmbiente(t) {
  const dt = Math.min(0.1, Math.max(0, t - ambienteT)); ambienteT = t;
  moverAmbiente(dt);
  lucesAndén.forEach((m, i) => { m.material.color.setRGB(0.18 * (0.55 + 0.45 * Math.sin(t * 2 + i)), 0.62 * (0.55 + 0.45 * Math.sin(t * 2 + i)), 0.35 * (0.55 + 0.45 * Math.sin(t * 2 + i))); });
  if (Math.floor(t * 2) !== Math.floor((t - dt) * 2)) dibujarTablero(t);
  montacargas.position.z = 2.5 + 4.5 * Math.sin(t * 0.22);
  montacargas.rotation.y = Math.cos(t * 0.22) > 0 ? 0 : Math.PI;
  montacargas2.position.z = 4.8 + 3.2 * Math.sin(t * 0.3 + 1);
  montacargas2.rotation.y = Math.cos(t * 0.3 + 1) > 0 ? 0 : Math.PI;
  CONDUCTORES.forEach(c => { if (c.mixer) c.mixer.update(dt); });
}

function makeStandingDe(T) {
  const av = makeFemAvatar(T); av.mixer.stopAllAction(); av.procedural = true; gltfPrepareBones(av); gltfStandPose(av);

}
function crearAmbiente() {
  if (typeof makeStandingOperator !== 'function' || ambientes.length) return;
  RUTAS_AMBIENTE.forEach((pts, i) => {
    const R = ROLES_AMBIENTE[i] || { fem: false };
    if (R.gerente) { gerenteEnPlaza(); return; }   // el gerente es un personaje fijo, no ruta
    /* cada trabajador toma una variante distinta del mismo grupo (hombre o mujer) de los simuladores */
    const pool = GLTF_EXTRA.filter(T => T.gltf && T.fem === !!R.fem); if (R.fem && GLTF_FEM.gltf) pool.push(GLTF_FEM);
    const T = pool.length ? pool[i % pool.length] : null;
    const op = T ? makeStandingDe(T) : makeStandingOperator(false);
    const g = new THREE.Group(); g.add(op); if (R.cargo) g.add(etiquetaCargo(R.cargo)); escena.add(g);
    ambientes.push({ g, pts, idx: 0, prog: 0, vel: 0.9, av: op.userData.gltf, paso: Math.random() * 6, fase: Math.random() });

function moverAmbiente(dt) {
  ambientes.forEach(a => {
    const A = a.pts[a.idx], B = a.pts[(a.idx + 1) % a.pts.length];
    const largo = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1;
    a.prog += dt * a.vel / largo;
    if (a.prog >= 1) { a.prog = 0; a.idx = (a.idx + 1) % a.pts.length; }
    const P = a.pts[a.idx], Q = a.pts[(a.idx + 1) % a.pts.length];
    a.g.position.set(P[0] + (Q[0] - P[0]) * a.prog, 0, P[1] + (Q[1] - P[1]) * a.prog);
    a.g.rotation.y = Math.atan2(Q[0] - P[0], Q[1] - P[1]);
    /* caminan con la misma pose de marcha del simulador: piernas, brazos y balanceo según la zancada */
    if (a.av) { a.paso += dt * 7; gltfWalkPose(a.av, true, a.paso, performance.now(), false, a.fase); }
    if (a.mixer) a.mixer.update(dt);   // trabajador con clips del modelo (caminar)
  });
}

function choca(x, z) {
  for (const c of COLISIONES_PLAZA) {
    if (x > c.minX - RADIO_AVATAR && x < c.maxX + RADIO_AVATAR && z > c.minZ - RADIO_AVATAR && z < c.maxZ + RADIO_AVATAR) return true;
  }
  /* montacargas en movimiento */
  for (const m of MONTACARGAS) { if (Math.abs(x - m.position.x) < 0.8 + RADIO_AVATAR && Math.abs(z - m.position.z) < 1.1 + RADIO_AVATAR) return true; }
  return false;
}
function mover(dt) {
  if (abierto) return;
  let girar = 0, avanzar = 0;
  if (pulsa('a')) girar += 1;
  if (pulsa('d')) girar -= 1;
  if (pulsa('w')) avanzar += 1;
  if (pulsa('s')) avanzar -= 1;
  heading += girar * GIRO * dt;
  moviendo = avanzar !== 0;
  if (moviendo) {
    const vel = pulsa('shift') ? VEL * 1.8 : VEL;
    const dx = Math.sin(heading) * avanzar * vel * dt;
    const dz = Math.cos(heading) * avanzar * vel * dt;
    const L = enInterior ? { x: INT_LIM.x, zMin: INT_LIM.zMin, zMax: INT_LIM.zMax } : LIMITE;
    const x0 = avatar.position.x, z0 = avatar.position.z;
    let nx = Math.max(-L.x, Math.min(L.x, x0 + dx));
    let nz = Math.max(L.zMin, Math.min(L.zMax, z0 + dz));
    if (!enInterior) {
      /* deslizar: primero prueba X, después Z; si choca en un eje se queda en el otro */
      if (choca(nx, z0)) nx = x0;
      if (choca(nx, nz)) nz = z0;
    }
    avatar.position.x = nx;
    avatar.position.z = nz;
    paso += dt * (pulsa('shift') ? 13 : 9);   // correr: zancada más rápida
  }
  avatar.rotation.y = heading;
  const sw = moviendo ? Math.sin(paso) * 0.6 : 0;
  piernaI.rotation.x = sw; piernaD.rotation.x = -sw;
  brazoI.rotation.x = -sw * 0.7; brazoD.rotation.x = sw * 0.7;

  if (avatarGltf) gltfWalkPose(avatarGltf, moviendo, paso, performance.now(), saludo > 0, 0);
}

}
function bloqueCasos(id) {
  const lista = CASOS[id] || [];
  const botones = lista.map(([cid, t]) => `<a class="btn" style="display:block;margin:6px 0;text-align:left" href="dojo-de-mando.html?caso=${cid}">▶ ${t}</a>`).join('');
  const pend = (PENDIENTES[id] || []).map(t => `<li>${t}</li>`).join('');
  return `
    <div class="puerta" style="border-left-color:#e8590c">
      <h3>C · Práctica (Dojo de Mando)</h3>
      <p>${lista.length ? 'Casos cargados. Cada uno abre la simulación en el Dojo.' : 'Aún no hay casos cargados en este módulo.'}</p>
      ${botones || ''}
      ${pend ? `<p style="margin-top:10px"><b>Pendientes de cargar (propuestos en el brief):</b></p><ul>${pend}</ul>` : ''}
    </div>`;
}
function abrirModulo(m) {
  abierto = m; cerca = m;
  document.getElementById('btnEntrar').classList.remove('on');
  ocultarAviso();
  const caja = document.getElementById('caja');
  const tituloId = 'tituloPanel';
  const aprende = m.activo
    ? `<div class="puerta"><h3>A · Lapzo (Aprende)</h3><p>Cursos asignados, videos, examen y diploma del módulo.</p>${LAPZO_URL ? `<a class="btn" href="${LAPZO_URL}" target="_blank" rel="noopener">Abrir en Lapzo</a>` : `<button class="btn" disabled>Abrir en Lapzo</button><div class="nota">Enlace pendiente de configurar con el administrador de Lapzo.</div>`}</div>`
    : `<div class="puerta" style="border-left-color:#9aa3c7"><h3>A · Lapzo (Aprende)</h3><p>Contenido pendiente de validación.</p><span class="chip pend">Pendiente</span></div>`;
  const entrena = m.activo
    ? `<div class="puerta" style="border-left-color:#2e9e5b"><h3>B · Entrenamiento (Entrena)</h3><p>Biblioteca de la sesión. Los materiales se cargarán cuando estén validados.</p><ul><li>Manual del participante</li><li>Presentación de la sesión</li><li>Guía del instructor</li><li>Ejercicios y formatos</li></ul><span class="chip pend">Materiales por cargar</span></div>`
    : `<div class="puerta" style="border-left-color:#9aa3c7"><h3>B · Entrenamiento (Entrena)</h3><p>Materiales pendientes de validación.</p><span class="chip pend">Pendiente</span></div>`;
  caja.innerHTML = `
    <div class="cab"><small>${m.activo ? 'MÓDULO ACTIVO' : 'ÁREA PREPARADA'}</small><h2 id="${tituloId}">${m.nombre}</h2></div>
    <div class="cuerpo">
      ${aprende}
      ${entrena}
      ${bloqueCasos(m.id)}
      <button class="cerrar" onclick="cerrarPanel()">Volver al centro de distribución</button>
    </div>`;
  document.getElementById('panel').classList.add('on');
}
/* materiales de ENTRENAMIENTO con visor de diapositivas: manuales por pilar y presentaciones */
const MANUALES = {
  m1: [
    { key: 'manual', base: 'assets/materiales/manual-pilar-1/', total: 19, pdf: 'manual-pilar-1.pdf', titulo: 'Manual · Pilar 1 · Tú eres una pieza clave' },
    { key: 'pres', base: 'assets/materiales/presentacion-pilar-1/', total: 40, pdf: 'presentacion-pilar-1.pdf', titulo: 'Presentación · Pilar 1 · 2026' }
  ],
  m2: [
    { key: 'manual', base: 'assets/materiales/manual-pilar-2/', total: 12, pdf: 'manual-pilar-2.pdf', titulo: 'Manual · Pilar 2 · Construimos excelencia' },
    { key: 'pres2', base: 'assets/materiales/presentacion-pilar-2/', total: 20, pdf: 'presentacion-pilar-2.pdf', titulo: 'Presentación · Pilar 2 · 2026' }
  ],
  m3: [
    { key: 'manual', base: 'assets/materiales/manual-pilar-3/', total: 9, pdf: 'manual-pilar-3.pdf', titulo: 'Manual · Pilar 3 · Movimientos que construyen' },
    { key: 'pres3', base: 'assets/materiales/presentacion-pilar-3/', total: 9, pdf: 'presentacion-pilar-3.pdf', titulo: 'Presentación · Pilar 3 · 2026' }
  ],
  m4: [
    { key: 'manual', base: 'assets/materiales/manual-pilar-4/', total: 6, pdf: 'manual-pilar-4.pdf', titulo: 'Manual · Pilar 4 · Tu herramienta clave' },
    { key: 'pres4', base: 'assets/materiales/presentacion-pilar-4/', total: 7, pdf: 'presentacion-pilar-4.pdf', titulo: 'Presentación · Pilar 4 · 2026' }
  ]
};
const VISORES = {};
function visorHTML(c) {
  VISORES[c.key] = { base: c.base, total: c.total, i: 1 };
  return `<div class="puerta" style="border-left-color:#2e9e5b"><h3>${c.titulo}</h3>
    <div style="text-align:center"><img id="${c.key}Img" src="${c.base}slide-01.jpg" alt="Diapositiva 1" style="max-width:100%;max-height:50vh;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25)"></div>
    <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap">
      <button class="btn" onclick="cambiarVisor('${c.key}', -1)">◀ Anterior</button>
      <span id="${c.key}Num" style="font-weight:700">1 / ${c.total}</span>
      <button class="btn" onclick="cambiarVisor('${c.key}', 1)">Siguiente ▶</button>
    </div>
    <p style="margin-top:10px"><a class="btn" href="${c.base}${c.pdf}" target="_blank" rel="noopener">Descargar PDF</a></p></div>`;
}
function bloqueManual(modId) { return (MANUALES[modId] || []).map(visorHTML).join(''); }
function cambiarVisor(key, d) {
  const v = VISORES[key];
  v.i = Math.min(v.total, Math.max(1, v.i + d));
  document.getElementById(key + 'Img').src = v.base + 'slide-' + String(v.i).padStart(2, '0') + '.jpg';
  document.getElementById(key + 'Num').textContent = v.i + ' / ' + v.total;
}
function cambiarManual(d) { cambiarVisor('manual', d); }
function abrirZona(id) {
  abierto = { id: 'zona-' + id };
  document.getElementById('btnEntrar').classList.remove('on');
  ocultarAviso();
  const caja = document.getElementById('caja');
  let cuerpo = '';
  if (id === 'lapzo') {
    cuerpo = `<div class="puerta"><h3>A · Lapzo (Aprende)</h3><p>Cursos asignados, videos, examen y diploma del módulo.</p>${LAPZO_URL ? `<a class="btn" href="${LAPZO_URL}" target="_blank" rel="noopener">Abrir en Lapzo</a>` : `<button class="btn" disabled>Abrir en Lapzo</button><div class="nota">Enlace pendiente de configurar con el administrador de Lapzo.</div>`}</div>`;
  } else if (id === 'entrena' && MANUALES[moduloInt.id]) {
    cuerpo = bloqueManual(moduloInt.id);
  } else if (id === 'entrena') {
    cuerpo = `<div class="puerta" style="border-left-color:#2e9e5b"><h3>B · Entrenamiento (Entrena)</h3><p>Biblioteca de la sesión. Los materiales se cargarán cuando estén validados.</p><ul><li>Manual del participante</li><li>Presentación de la sesión</li><li>Guía del instructor</li><li>Ejercicios y formatos</li></ul><span class="chip pend">Materiales por cargar</span></div>`;
  } else {
    cuerpo = bloqueCasos(moduloInt.id);
  }
  const titulo = { lapzo: 'A · Lapzo · Aprende', entrena: 'B · Entrenamiento · Entrena', dojo: 'C · Práctica | Simula' }[id];
  caja.innerHTML = `<div class="cab"><small>${moduloInt.nombre}</small><h2 id="tituloPanel">${titulo}</h2></div><div class="cuerpo">${cuerpo}<button class="cerrar" onclick="cerrarPanel()">Volver al interior</button></div>`;
  document.getElementById('panel').classList.add('on');
}
function cerrarPanel() {
  abierto = null;
  document.getElementById('panel').classList.remove('on');
  if (enInterior) { if (zonaCerca) { const b = document.getElementById('btnEntrar'); b.textContent = (zonaCerca.id === 'salida' ? '' : 'Entrar · ') + zonaCerca.corto + ' (E)'; b.classList.add('on'); } return; }
  if (cerca) { const btn = document.getElementById('btnEntrar'); btn.textContent = 'Entrar · ' + cerca.corto + ' (E)'; btn.classList.add('on'); }
}

/* ===================== Bucle ===================== */
function ajustar() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camara.aspect = w / h; camara.updateProjectionMatrix();
}
window.addEventListener('resize', ajustar); ajustar();
camara.position.set(0, 3, 14);

actualizarObjetivo();
let ultimo = performance.now();
function bucle(t) {
  const dt = Math.min(0.05, (t - ultimo) / 1000); ultimo = t;
  mover(dt); detectar(); seguirCamara(dt); animarAmbiente(t / 1000);
  if (saludo > 0) saludo -= dt;
  if (avisoT > 0) { avisoT -= dt; if (avisoT <= 0) ocultarAviso(); }
  renderer.render(enInterior ? interiorActual : escena, camara);
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);
</script>
