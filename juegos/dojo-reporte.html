<!doctype html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dojo de Mando · Reporte del grupo</title>
<style>
:root{--azul:#1D2586;--gris:#6b7390;--bg:#f4f6fb}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 Inter,Arial,sans-serif;background:var(--bg);color:#1b2240}
header{background:linear-gradient(90deg,#1D2586,#3b1f86);color:#fff;padding:22px 16px}header small{color:#f5b800;font-weight:700;letter-spacing:.05em}header h1{margin:4px 0 0;font-size:26px}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(20,30,80,.06)}
h2{margin:0 0 10px;font-size:18px;color:var(--azul)}
.drop{display:block;margin-top:8px;cursor:pointer;border:2px dashed #b9c2e0;border-radius:12px;padding:22px;text-align:center;color:var(--gris)}.drop b{color:var(--azul)}
.btn{display:inline-block;background:var(--azul);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}select{padding:8px;border-radius:8px;border:1px solid #d6dbea}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpis div{background:var(--bg);border-radius:12px;padding:12px;text-align:center}.kpis b{display:block;font-size:26px;color:var(--azul)}.kpis small{color:var(--gris)}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:#ece6fb;color:#3b1f86;text-align:left;padding:6px}td{border-bottom:1px solid #eee;padding:6px}
.bar{height:10px;background:#e6e9f5;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#4f7bd8}
.note{font-size:13px;color:var(--gris)}.ok{color:#2e9e5b;font-weight:700}.no{color:#c62828;font-weight:700}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.tw{overflow:auto}}
</style></head><body>
<header><small>DOJO DE MANDO · DICKA LOGISTICS</small><h1>Reporte del grupo (instructor / RH)</h1></header>
<main>
 <div class="card"><h2>1. Cargar resultados</h2>
  <label class="drop" id="drop"><input type="file" id="f" accept=".csv,.json" multiple hidden><b>Toca para elegir</b> o arrastra aquí los CSV (o JSON) exportados desde el Dojo. Puedes cargar varios a la vez.</label>
  <p class="note">🔒 Los archivos se leen solo en este navegador; no se envían a ningún servidor. Funciona sin conexión.</p><div id="msg" class="note"></div></div>
 <div class="card" id="out" hidden>
  <div class="row" style="justify-content:space-between"><h2 style="margin:0">2. Resultados</h2><div class="row"><span>Almacén</span><select id="fa"></select><span>Nivel</span><select id="fn"></select></div></div>
  <div class="kpis" style="margin-top:12px" id="kp"></div>
  <h2 style="margin-top:16px">Objetivos más débiles del grupo</h2><div id="obj"></div>
  <h2 style="margin-top:16px">Promedio por situación</h2><div class="tw" id="sit"></div>
  <h2 style="margin-top:16px">Por participante</h2><div class="tw" id="par"></div>
 </div>
</main>
<script>
const $ = id => document.getElementById(id); let ROWS = [];
const OBJ = [['obj_metas', '🎯 Fijar metas'], ['obj_necesidades', '👂 Conocer necesidades'], ['obj_retro', '💬 Retroalimentación'], ['obj_delegar', '🤝 Delegar']];
function parseCSV(t) { t = t.replace(/^﻿/, ''); const out = []; let row = [], cell = '', q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i]; if (q) { if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some(x => x !== '')) out.push(row); row = []; } else cell += c; }
  row.push(cell); if (row.some(x => x !== '')) out.push(row); const h = out.shift() || []; return out.map(r => Object.fromEntries(h.map((k, i) => [k.trim(), r[i] ?? '']))); }
async function load(files) { let n = 0, bad = 0; for (const f of files) { try { const t = await f.text(); const rows = /\.json$/i.test(f.name) ? (JSON.parse(t).registros || []) : parseCSV(t);
      if (!rows.length || !('session_id' in rows[0])) { bad++; continue; } rows.forEach(r => { if (!ROWS.some(x => x.session_id === r.session_id)) { ROWS.push(r); n++; } }); } catch (e) { bad++; } }
  $('msg').textContent = `${n} registros nuevos cargados (${ROWS.length} en total)${bad ? ` · ${bad} archivo(s) no reconocido(s)` : ''}.`; fill(); render(); }
function fill() { const opt = (sel, k) => { const cur = sel.value; sel.innerHTML = '<option value="">Todos</option>' + [...new Set(ROWS.map(r => r[k]).filter(Boolean))].sort().map(v => `<option>${v}</option>`).join(''); sel.value = cur; }; opt($('fa'), 'almacen'); opt($('fn'), 'nivel'); }
const num = v => v === '' || v == null ? null : +v, avg = a => { const v = a.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; }, f0 = v => v == null ? '—' : Math.round(v);
function render() { const R0 = ROWS.filter(r => (!$('fa').value || r.almacen === $('fa').value) && (!$('fn').value || r.nivel === $('fn').value)), MOD = R0.filter(r => r.tipo === 'modelo').length, R = R0.filter(r => r.tipo !== 'modelo'); $('out').hidden = !ROWS.length; if (!R.length) { $('kp').innerHTML = '<div>Sin datos con estos filtros</div>'; ['obj', 'sit', 'par'].forEach(i => $(i).innerHTML = ''); return; }
  const people = [...new Set(R.map(r => r.nombre))], apr = R.filter(r => /^s/i.test(r.aprobado)).length;
  $('kp').innerHTML = `<div><b>${people.length}</b><small>participantes</small></div><div><b>${R.length}</b><small>pláticas</small></div><div><b>${f0(avg(R.map(r => num(r.puntaje))))}</b><small>puntaje promedio</small></div><div><b>${Math.round(100 * apr / R.length)}%</b><small>aprobadas</small></div>` + (MOD ? `<div style="grid-column:1/-1;font-size:13px">👀 ${MOD} vista(s) de "cómo lo manejaría" (no cuentan en los promedios)</div>` : '');
  const o = OBJ.map(([k, n]) => [n, avg(R.map(r => num(r[k])))]).sort((a, b) => (a[1] ?? 1) - (b[1] ?? 1));
  $('obj').innerHTML = o.map(([n, v], i) => `<div style="display:grid;grid-template-columns:200px 1fr 60px;gap:10px;align-items:center;margin:5px 0"><span>${i < 2 ? '⚠️ ' : ''}${n}</span><div class="bar"><i style="width:${(v ?? 0) * 100}%;background:${i < 2 ? '#c62828' : '#4f7bd8'}"></i></div><b>${v == null ? '—' : Math.round(v * 100) + '%'}</b></div>`).join('') + '<p class="note">Porcentaje de pláticas en que se cumplió el objetivo. Los dos más bajos son prioridad de capacitación del grupo.</p>';
  const by = (k) => { const m = {}; R.forEach(r => (m[r[k]] = m[r[k]] || []).push(r)); return m; };
  const S = Object.entries(by('situacion')).map(([s, a]) => [s, a.length, avg(a.map(r => num(r.puntaje))), a.filter(r => /^s/i.test(r.aprobado)).length / a.length]).sort((a, b) => a[2] - b[2]);
  $('sit').innerHTML = `<table><tr><th>Situación</th><th>Pláticas</th><th>Puntaje promedio</th><th>% aprobadas</th></tr>${S.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td><td>${f0(x[2])}</td><td>${Math.round(x[3] * 100)}%</td></tr>`).join('')}</table>`;
  const P = Object.entries(by('nombre')).map(([n, a]) => { a.sort((x, y) => String(x.fecha).localeCompare(String(y.fecha))); const first = num(a[0].puntaje), last = avg(a.slice(-3).map(r => num(r.puntaje))); const weak = OBJ.map(([k, l]) => [l, avg(a.map(r => num(r[k])))]).sort((x, y) => (x[1] ?? 1) - (y[1] ?? 1))[0];
      return `<tr><td>${n}</td><td>${a[0].num_empleado || ''}</td><td>${a[0].nivel || ''}</td><td>${a[0].almacen || ''}</td><td>${a.length}</td><td>${f0(avg(a.map(r => num(r.puntaje))))}</td><td>${a.length > 1 ? `<span class="${last - first >= 0 ? 'ok' : 'no'}">${last - first >= 0 ? '+' : ''}${Math.round(last - first)}</span>` : '<span class="note">solo línea base</span>'}</td><td>${f0(avg(a.map(r => num(r.pct_platica))))}%</td><td>${weak[0]}</td><td>${String(a[a.length - 1].fecha).slice(0, 10)}</td></tr>`; });
  $('par').innerHTML = `<table><tr><th>Participante</th><th>No. emp.</th><th>Nivel</th><th>Almacén</th><th>Pláticas</th><th>Promedio</th><th>Cambio vs. línea base</th><th>% habla</th><th>Objetivo más débil</th><th>Última</th></tr>${P.join('')}</table>`; }
$('f').onchange = e => load([...e.target.files]); ['fa', 'fn'].forEach(i => $(i).onchange = render);
const d = $('drop'); d.ondragover = e => { e.preventDefault(); d.style.borderColor = '#1D2586'; }; d.ondragleave = () => d.style.borderColor = ''; d.ondrop = e => { e.preventDefault(); d.style.borderColor = ''; load([...e.dataTransfer.files]); };
</script></body></html>
