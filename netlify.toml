[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/respaldos/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Bloquea el acceso público a los respaldos con datos de colaboradores
[[redirects]]
  from = "/respaldos/*"
  to = "/404.html"
  status = 404
  force = true
