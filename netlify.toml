[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/respaldos/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Bloquea el acceso público a los respaldos con datos de colaboradores
[[redirects]]
  from = "/respaldos/*"
  to = "/404.html"
  status = 404
  force = true

# Siempre revalidar páginas, scripts y modelos: evita que el navegador muestre versiones anteriores tras un deploy
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/juegos/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# App Android/PWA: el service worker y el manifest nunca se guardan en caché del navegador
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
